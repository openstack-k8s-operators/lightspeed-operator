---
# CI job for deploying OpenStack Lightspeed operator
- job:
    name: lightspeed-operator-deployment-crc
    parent: podified-multinode-hci-deployment-crc-1comp-backends
    attempts: 1
    final: true
    dependencies:
      - openstack-k8s-operators-content-provider
    required-projects:
      - openstack-k8s-operators/lightspeed-operator
      - openstack-k8s-operators/ci-framework
    secrets:
      - name: openai_credentials
        secret: lightspeed-openai-token
    # Stage the encrypted secret into a ci-framework parameters file before the
    # run. run_hook loads every artifacts/parameters/*.yml as extra-vars for each
    # hook, so the install hook receives cifmw_openstack_lightspeed_api_token as
    # a concrete value and creates the Secret in-cluster during the run. See the
    # playbook header for why a job var / set_fact / direct k8s create all fail.
    pre-run: ci/playbooks/set_lightspeed_token.yml
    # Delete the token parameters file after the run (even on cancel) so it is not
    # left on disk to be collected into build logs/artifacts.
    post-run:
      - name: ci/playbooks/cleanup_lightspeed_token.yml
        cleanup: true
    vars:
      pre_tests_01_deploy_lightspeed_operator:
        source: install-openstack-lightspeed.yml
        type: playbook

      # Operator catalog image from content-provider dependency
      cifmw_openstack_lightspeed_catalog_image: "{{ content_provider_registry_ip }}:5001/openstack-k8s-operators/lightspeed-operator-index:{{ zuul.patchset }}"

      # LLM configuration
      cifmw_openstack_lightspeed_llm_endpoint: "https://api.example.com/v1/chat/completions"
      cifmw_openstack_lightspeed_model_name: "example-model"

      # cifmw_openstack_lightspeed_api_token is intentionally NOT set here. It is
      # provided at run time from artifacts/parameters/lightspeed-token.yml, which
      # the pre-run playbook (ci/playbooks/set_lightspeed_token.yml) writes from
      # the encrypted secret. It must NOT be referenced here as
      # "{{ openai_credentials.api_token }}" -- the secret is not in scope when
      # ci-framework serializes these vars.

      # TLS CA cert omitted for CI - not needed for dummy endpoint testing
      # Operator fails to parse invalid PEM data; omitting allows reconciliation to proceed
      # to expected failure point (LLM credential validation)
      # Uncomment and provide valid PEM cert when testing with real LLM endpoint

      # cifmw_openstack_lightspeed_ca_cert: "dummy-cert-for-ci"
      cifmw_os_must_gather_additional_namespaces: "openstack-lightspeed"
      cifmw_os_must_gather_omc: false

- job:
    name: lightspeed-operator-kuttl
    parent: cifmw-base-multinode-kuttl
    dependencies:
      - openstack-k8s-operators-content-provider
    attempts: 1
    irrelevant-files: &irrelevant-files
      - ^.*/\*.md$
      - ^\.\..*$
      - ^docs/.*$
      - ^LICENSE$
      - ^OWNERS$
      - ^OWNERS_ALIASES$
      - ^PROJECT$
      - ^README.md$
      - ^tests?\/functional
      - ^roles/.*/molecule/.*
    vars:
      cifmw_kuttl_tests_operator_list:
        - openstack_lightspeed
      cifmw_os_must_gather_additional_namespaces: "openstack-lightspeed"
      cifmw_os_must_gather_omc: false
