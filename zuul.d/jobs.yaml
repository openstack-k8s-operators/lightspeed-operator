---
# CI job for deploying OpenStack Lightspeed operator
- job:
    name: lightspeed-operator-deployment-crc
    parent: podified-multinode-hci-deployment-crc-1comp-backends
    attempts: 1
    final: true
    dependencies:
      - openstack-k8s-operators-content-provider
    required-projects:
      - openstack-k8s-operators/lightspeed-operator
      - openstack-k8s-operators/ci-framework
    secrets:
      - name: openai_credentials
        secret: lightspeed-openai-token
    # Creates the token Secret in-cluster before the run (see playbook header).
    pre-run: ci/playbooks/create_lightspeed_secret.yml
    # cleanup: true so Zuul still attempts the delete when the job is canceled.
    post-run:
      - name: ci/playbooks/cleanup_lightspeed_secret.yml
        cleanup: true
    vars:
      cifmw_extras:
        - '@scenarios/centos-9/multinode-ci.yml'
        - '@scenarios/centos-9/hci_ceph_backends.yml'
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/lightspeed-operator'].src_dir }}/ci/vars-lightspeed.yml"

      cifmw_run_tests: true
      cifmw_test_operator_fail_on_test_failure: true
      # Run Lightspeed integration tests through test-operator.
      cifmw_test_operator_stages:
        - name: lightspeed
          type: ansibletest

      cifmw_test_operator_namespace: openstack
      cifmw_test_operator_privileged: false
      cifmw_test_operator_ansibletest_name: ansibletest
      cifmw_test_operator_ansibletest_image: quay.io/podified-antelope-centos9/openstack-ansible-tests
      cifmw_test_operator_ansibletest_image_tag: current-podified
      cifmw_test_operator_ansibletest_ansible_git_repo: https://github.com/openstack-k8s-operators/lightspeed-tests
      cifmw_test_operator_ansibletest_ansible_git_branch: ""
      cifmw_test_operator_ansibletest_ansible_playbook_path: playbooks/run_lightspeed_tests.yaml
      cifmw_test_operator_ansibletest_ansible_inventory: |
        localhost ansible_connection=local ansible_python_interpreter=python3
      cifmw_test_operator_ansibletest_debug: false
      cifmw_test_operator_ansibletest_resources:
        requests:
          cpu: 1000m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 2Gi
      # Allow bootstrap to save parameters before runner and PVC facts exist.
      # The collector supplies those facts when it creates this Pod.
      # Match AnsibleTest UID/GID 227 and its SELinux label to read the PVC.
      # The role exposes a full Pod override, not a reader security-context setting.
      cifmw_test_operator_log_pod_definition:
        apiVersion: v1
        kind: Pod
        metadata:
          name: >-
            test-operator-logs-pod-{{ run_test_fw | default('ansibletest') }}-{{
            test_operator_instance_name | default('ansibletest-lightspeed') }}
          namespace: "{{ cifmw_test_operator_namespace }}"
          annotations:
            openshift.io/required-scc: nonroot-v2
        spec:
          securityContext:
            runAsUser: 227
            runAsGroup: 227
            fsGroup: 227
          containers:
            - name: test-operator-logs-container
              image: "{{ cifmw_test_operator_logs_image | default('quay.io/quay/busybox') }}"
              command: ["sleep"]
              args: ["infinity"]
              # Resolve the collector's nested instance-name template before use.
              volumeMounts: >-
                {{ (_test_operator_volume_mounts | default([]) | to_json)
                   | replace('{{ test_operator_instance_name }}',
                             test_operator_instance_name | default('ansibletest-lightspeed'))
                   | from_json }}
          volumes: "{{ _test_operator_volumes | default([]) }}"
          tolerations: "{{ cifmw_test_operator_tolerations | default(omit) }}"
          nodeSelector: "{{ cifmw_test_operator_node_selector | default(omit) }}"
      cifmw_test_operator_ansibletest_ansible_var_files: |
        test_suite_path: /var/lib/ansible/ansible
        lightspeed_url: "https://lightspeed-app-server.{{ cifmw_openstack_lightspeed_namespace | default('openstack-lightspeed') }}.svc.cluster.local:8443"
        lightspeed_timeout: 120
        lightspeed_model: "provider-default-model/default-model"
        pytest_args: "-v --tb=short --color=no -m 'not llm_dependent' -k integration"
        junit_xml_path: /var/lib/AnsibleTests/external_files/lightspeed-tests/junit.xml
      cifmw_test_operator_ansibletest_extra_mounts:
        - name: lightspeed
          extraVol:
            - propagation: [AnsibleTest]
              extraVolType: Undefined
              volumes:
                - name: lightspeed-client-token
                  projected:
                    sources:
                      - serviceAccountToken:
                          path: token
                          expirationSeconds: 3600
              mounts:
                - name: lightspeed-client-token
                  mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                  readOnly: true

      cifmw_openstack_lightspeed_mock_enabled: false

      # Operator catalog image from content-provider dependency
      cifmw_openstack_lightspeed_catalog_image: "{{ content_provider_registry_ip }}:5001/openstack-k8s-operators/lightspeed-operator-index:{{ zuul.patchset }}"

      # Use provider secrets created by the pre-run playbook
      cifmw_openstack_lightspeed_llm_endpoint: "https://api.openai.com/v1"
      cifmw_openstack_lightspeed_llm_endpoint_type: "openai"
      cifmw_openstack_lightspeed_model_name: "gpt-4o-mini"

      openstack_assistant_enabled: true

      cifmw_os_must_gather_additional_namespaces: "openstack-lightspeed"
      cifmw_os_must_gather_omc: false

- job:
    name: lightspeed-operator-kuttl
    parent: cifmw-base-multinode-kuttl
    dependencies:
      - openstack-k8s-operators-content-provider
    attempts: 1
    vars:
      cifmw_kuttl_tests_operator_list:
        - openstack_lightspeed
      cifmw_os_must_gather_additional_namespaces: "openstack-lightspeed"
      cifmw_os_must_gather_omc: false
