# CI job for deploying OpenStack Lightspeed operator
- job:
    name: lightspeed-operator-deployment-crc
    parent: podified-multinode-hci-deployment-crc-1comp-backends
    attempts: 1
    dependencies:
      - openstack-k8s-operators-content-provider
    required-projects:
      - openstack-k8s-operators/lightspeed-operator
      - openstack-k8s-operators/ci-framework
    vars:
      pre_tests_01_deploy_lightspeed_operator:
        source: install-openstack-lightspeed.yml
        type: playbook

      # Operator catalog image from content-provider dependency
      cifmw_openstack_lightspeed_catalog_image: "{{ content_provider_registry_ip }}:5001/openstack-k8s-operators/lightspeed-operator-index:{{ zuul.patchset }}"

      # LLM configuration
      cifmw_openstack_lightspeed_llm_endpoint: "https://api.example.com/v1/chat/completions"
      cifmw_openstack_lightspeed_model_name: "example-model"

      # Mock token for CI deployment testing (operator installs but service won't be functional)
      cifmw_openstack_lightspeed_api_token: "dummy-token-for-ci"

      # TLS CA cert omitted for CI - not needed for dummy endpoint testing
      # Operator fails to parse invalid PEM data; omitting allows reconciliation to proceed
      # to expected failure point (LLM credential validation)
      # Uncomment and provide valid PEM cert when testing with real LLM endpoint

      # cifmw_openstack_lightspeed_ca_cert: "dummy-cert-for-ci"

- job:
    name: lightspeed-operator-kuttl
    parent: cifmw-multinode-kuttl
    dependencies:
      - openstack-k8s-operators-content-provider
    attempts: 1
    irrelevant-files: &irrelevant-files
      - ^.*/\*.md$
      - ^\.\..*$
      - ^docs/.*$
      - ^LICENSE$
      - ^OWNERS$
      - ^OWNERS_ALIASES$
      - ^PROJECT$
      - ^README.md$
      - ^tests?\/functional
      - ^roles/.*/molecule/.*
    vars:
      cifmw_kuttl_tests_operator_list:
        - openstack_lightspeed


# One-off DNM job to confirm openstack-must-gather collects the
# openstack-lightspeed namespace in CI. It reuses the kuttl job as-is (which
# really deploys the operator into openstack-lightspeed), and forces the kuttl
# test to fail fast with a 1s timeout. Because the make target runs the chain
# `... openstack-lightspeed-deploy kuttl-test openstack-lightspeed-undeploy`,
# a failing kuttl-test aborts make BEFORE undeploy -- so the deployment is still
# live when the base job's post-phase must-gather runs.
#
# The `leak-canary` post-run playbook additionally plants a FAKE OpenAI-style
# token (sk-proj-...) into the live openstack-lightspeed namespace (a ConfigMap
# and a Pod log) so we can confirm ci-framework's crawl_n_mask masks it in the
# collected must-gather artifacts. The child post-run runs before the base job's
# must-gather post-run, so the leak is present when must-gather collects.
#
# The `zuul-secret-leak` pre-run playbook is a SEPARATE experiment: it prints a
# registered Zuul secret to the console with no_log:false vs no_log:true, to
# confirm Zuul does NOT text-mask secret values in job-output.txt (it relies on
# Ansible no_log). Attaching the secret is what forces this job post-review.
#
# NOTE: this job is intentionally RED. It exists only to inspect the must-gather
# artifacts (logs/openstack-must-gather/.../namespaces/openstack-lightspeed) and
# is not meant to merge.
- job:
    name: lightspeed-operator-must-gather
    parent: lightspeed-operator-kuttl
    attempts: 1
    irrelevant-files: *irrelevant-files
    pre-run: ci/playbooks/zuul-secret-leak.yml
    post-run: ci/playbooks/leak-canary.yml
    secrets:
      - name: zuul_leak_secret
        secret: lightspeed-zuul-mask-test
    vars:
      cifmw_os_must_gather_additional_namespaces: "openstack-lightspeed"
      cifmw_os_must_gather_omc: false
      # openstack-lightspeed-deploy runs first in the make chain and completes;
      # the 1s kuttl timeout then fails kuttl-test, aborting make before the
      # openstack-lightspeed-undeploy step. KUTTL_ARGS is unset in the Makefile,
      # so this env var flows straight into `kubectl-kuttl test ... $(KUTTL_ARGS)`.
      # (Set via *_env_vars, not *_env, which is recomputed by a set_fact.)
      cifmw_kuttl_tests_env_vars:
        KUTTL_ARGS: "--timeout 1"
