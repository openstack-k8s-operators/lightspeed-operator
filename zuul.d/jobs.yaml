---
# CI job for deploying OpenStack Lightspeed operator
- job:
    name: lightspeed-operator-deployment-crc
    parent: podified-multinode-hci-deployment-crc-1comp-backends
    attempts: 1
    dependencies:
      - openstack-k8s-operators-content-provider
    required-projects:
      - openstack-k8s-operators/lightspeed-operator
      - openstack-k8s-operators/ci-framework
      # Use the prepared test checkout, including Depends-On changes.
      - openstack-k8s-operators/lightspeed-tests
    vars:
      pre_tests_01_deploy_lightspeed_operator:
        source: install-openstack-lightspeed.yml
        type: playbook

      cifmw_run_tests: true
      cifmw_test_operator_fail_on_test_failure: true
      # Retain the inherited default Tempest stage, then test Lightspeed in a Pod.
      cifmw_test_operator_stages:
        - name: tempest
          type: tempest
        - name: lightspeed
          type: ansibletest
          pre_test_stage_hooks:
            - name: Prepare Lightspeed tests
              source: prepare-openstack-lightspeed-tests.yml
              type: playbook
          test_vars_file: "{{ cifmw_basedir }}/artifacts/lightspeed-test-stage.yml"

      cifmw_openstack_lightspeed_mock_enabled: true
      # Use the corrected Solr search provider; retain the default API image.
      cifmw_openstack_lightspeed_ogx_image: quay.io/lightspeed-core/lightspeed-stack:0.7.0

      # Operator catalog image from content-provider dependency
      cifmw_openstack_lightspeed_catalog_image: "{{ content_provider_registry_ip }}:5001/openstack-k8s-operators/lightspeed-operator-index:{{ zuul.patchset }}"

      # Mock provider deployed by the ci-framework hook
      cifmw_openstack_lightspeed_llm_endpoint: "http://mock-llm-api-server-pod.openstack-lightspeed.svc.cluster.local:8000/v1"
      cifmw_openstack_lightspeed_llm_endpoint_type: "openai"
      cifmw_openstack_lightspeed_model_name: "example-model"
      cifmw_openstack_lightspeed_api_token: "dummy-token-for-ci"

      cifmw_os_must_gather_additional_namespaces: "openstack-lightspeed"
      cifmw_os_must_gather_omc: false

- job:
    name: lightspeed-operator-kuttl
    parent: cifmw-base-multinode-kuttl
    dependencies:
      - openstack-k8s-operators-content-provider
    attempts: 1
    vars:
      cifmw_kuttl_tests_operator_list:
        - openstack_lightspeed
      cifmw_os_must_gather_additional_namespaces: "openstack-lightspeed"
      cifmw_os_must_gather_omc: false
