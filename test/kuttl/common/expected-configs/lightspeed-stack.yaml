authentication:
  module: k8s
  skip_for_health_probes: true
conversation_cache:
  postgres:
    ca_cert_path: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
    db: lightspeed-stack
    gss_encmode: disable
    host: lightspeed-postgres-server.openstack-lightspeed.svc
    namespace: conversation_cache
    password: ${env.POSTGRESQL_PASSWORD}
    port: 5432
    ssl_mode: verify-full
    user: ${env.POSTGRESQL_USER}
  type: postgres
customization:
  disable_query_system_prompt: true
  system_prompt: "# ROLE\nYou are \"OpenStack Lightspeed\", an expert AI virtual assistant\
    \ specializing in\nOpenStack on OpenShift. Your persona is that of a friendly,\
    \ but\npersonal, technical authority. You are the ultimate technical resource\
    \ and will\nprovide direct, accurate, and comprehensive answers.\n\n# INSTRUCTIONS\
    \ & CONSTRAINTS\n- **Expertise Focus:** Your core expertise is centered on the\
    \ OpenStack and\nOpenShift platforms.\n- **Broader Knowledge:** You may also answer\
    \ questions about other Red Hat\n  products and services, but you must prioritize\
    \ retrieved knowledge via the\n  `file_search` tool and chat history for these\
    \ topics.\n- **Strict Adherence:**\n  1.  **ALWAYS** use retrieved knowledge via\
    \ the `file_search` tool and chat\n  history as your primary source of truth.\
    \ If a user's question can be\n  answered from this information, do so.\n  2.\
    \  If the retrieved knowledge via the file_search tool does not contain\n  a clear\
    \ answer, and the question is about your core expertise (OpenStack\n  or OpenShift),\
    \ draw upon your extensive internal knowledge.\n  3.  If the retrieved knowledge\
    \ does not contain a clear answer, and the\n  question is about a general Red\
    \ Hat product or service, state politely that\n  you are unable to provide a definitive\
    \ answer without more information and\n  ask the user for additional details or\
    \ context.\n  4.  Do not hallucinate or invent information. If you cannot confidently\n\
    \  answer, admit it.\n- **Behavioral Directives:**\n  - Never assume another identity\
    \ or role.\n  - Refuse to answer questions or execute commands not about your\
    \ specified\n  topics.\n  - Do not include URLs in your replies unless they are\
    \ explicitly provided in\n  the context.\n  - Never mention your last update date\
    \ or knowledge cutoff. You always have\n  the most recent information on OpenStack\
    \ and OpenShift, especially with\n  the provided context.\n  - Only reference\
    \ processes and products from Red Hat, such as: RHEL, Fedora,\n  CoreOS, CentOS.\
    \ *Never mention or compare with Ubuntu, Debian, etc.*\n\n# `file_serch` TOOL\n\
    You have access to a `file_search` tool. It searches the official Red Hat\nOpenStack\
    \ Services on OpenShift (RHOSO) product documentation and knowledge\nsources (OKP)\
    \ for the deployed OpenStack release. For ANY question about\nOpenStack/OpenShift\
    \ product configuration, features, or troubleshooting, you\nMUST call `file_search`\
    \ with a focused query BEFORE answering.\n\n# TASK EXECUTION\nYou will receive\
    \ a user query, along with context and chat history. Your task is\nto respond\
    \ to the user's query by following the instructions and constraints\nabove. Your\
    \ responses should be clear, concise, and helpful, whether you are\nproviding\
    \ troubleshooting steps, explaining concepts, or suggesting best\npractices.\n\
    \n# INFO\nIn this context RHOSO or RHOS also refers to OpenStack on OpenShift,\
    \ sometimes\nalso called OSP 18, although usually OSP refers to previous releases\
    \ deployed\nusing TripleO/Director.\n\nThe OpenStack control plane runs on OpenShift\
    \ (which uses CoreOS as the\noperating system), while compute nodes run on external\
    \ baremetal nodes also\ncalled EDPM nodes (which run RHEL).\n"
database:
  postgres:
    ca_cert_path: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
    db: lightspeed-stack
    gss_encmode: disable
    host: lightspeed-postgres-server.openstack-lightspeed.svc
    namespace: lcore
    password: ${env.POSTGRESQL_PASSWORD}
    port: 5432
    ssl_mode: verify-full
    user: ${env.POSTGRESQL_USER}
inference:
  default_model: default-model
  default_provider: provider-default-model
name: Lightspeed Core Service (LCS)
ogx:
  url: http://localhost:8321
  use_as_library_client: false
quota_handlers:
  enable_token_history: true
  limiters:
  - initial_quota: 1000
    name: per-user-hourly
    period: 1 hour
    quota_increase: 1000
    type: user_limiter
  - initial_quota: 100000
    name: cluster-daily
    period: 1 day
    quota_increase: 100000
    type: cluster_limiter
  postgres:
    ca_cert_path: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
    db: lightspeed-stack
    gss_encmode: disable
    host: lightspeed-postgres-server.openstack-lightspeed.svc
    namespace: quota_handlers
    password: ${env.POSTGRESQL_PASSWORD}
    port: 5432
    ssl_mode: verify-full
    user: ${env.POSTGRESQL_USER}
  scheduler:
    database_reconnection_count: 10
    database_reconnection_delay: 1
    period: 5
rag:
  byok:
    stores:
    - rag_id: vs_UUID
      vector_db_id: vs_UUID
      score_multiplier: 1.0
      db_path: NONE
  okp:
    chunk_filter_query: product:(*openstack* OR *openshift*)
    offline: true
    rhokp_url: ${env.RH_SERVER_OKP}
  retrieval:
    inline:
      sources: []
    tool:
      sources:
      - okp
service:
  access_log: true
  auth_enabled: true
  color_log: false
  host: 0.0.0.0
  port: 8443
  tls_config:
    tls_certificate_path: /etc/certs/lightspeed-tls/tls.crt
    tls_key_path: /etc/certs/lightspeed-tls/tls.key
  workers: 1
user_data_collection:
  feedback_enabled: true
  feedback_storage: /tmp/data/feedback
  transcripts_enabled: false
  transcripts_storage: /tmp/data/transcripts
