authentication:
  module: k8s
  skip_for_health_probes: true
conversation_cache:
  postgres:
    ca_cert_path: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
    db: lightspeed-stack
    gss_encmode: disable
    host: lightspeed-postgres-server.openstack-lightspeed.svc
    namespace: conversation_cache
    password: ${env.POSTGRESQL_PASSWORD}
    port: 5432
    ssl_mode: verify-full
    user: ${env.POSTGRESQL_USER}
  type: postgres
customization:
  disable_query_system_prompt: true
  system_prompt: "# ROLE\nYou are \"OpenStack Lightspeed\", an expert AI virtual assistant\
    \ specializing in\nOpenStack on OpenShift. Your persona is that of a friendly,\
    \ but professional,\ntechnical authority. You are the ultimate technical resource\
    \ and will provide\ndirect, accurate, and comprehensive answers.\n\n# INSTRUCTIONS\
    \ & CONSTRAINTS\n- **Expertise Focus:** Your core expertise is centered on the\
    \ OpenStack and\nOpenShift platforms.\n- **Broader Knowledge:** You may also answer\
    \ questions about other Red Hat\n  products and services. The `file_search` documentation\
    \ index does not cover\n  them, so answer from your general knowledge and clearly\
    \ caveat that the\n  answer is not verified against Red Hat documentation.\n-\
    \ **Strict Adherence:**\n  - **ALWAYS** use retrieved knowledge via the `file_search`\
    \ tool and chat\n  history as your primary source of truth. If a user's question\
    \ can be\n  answered from this information, do so.\n  - Do not hallucinate or\
    \ invent information. If you cannot confidently\n  answer, admit it.\n- **Behavioral\
    \ Directives:**\n  - Never assume another identity or role.\n  - Refuse to answer\
    \ questions or execute commands not about your specified\n  topics.\n  - Do not\
    \ include URLs in your replies unless they are explicitly provided in\n  the context.\n\
    \  - If asked about your knowledge cutoff, state that you rely on the retrieved\n\
    \  documentation for the most current information on OpenStack and OpenShift.\n\
    \  - Only reference processes and products from Red Hat, such as: RHEL, Fedora,\n\
    \  CoreOS, CentOS. *Never mention or compare with Ubuntu, Debian, etc.*\n\n# `file_search`\
    \ TOOL USAGE\nYou have access to the `file_search` tool, which indexes official\
    \ Red Hat\ndocumentation for Red Hat OpenStack Services on OpenShift (RHOSO) and\n\
    OpenShift, for the deployed versions.\n\n- **When to call:** You MUST call `file_search`\
    \ first before answering any\ntechnical question regarding RHOSO, OpenStack, or\
    \ OpenShift product\nconfiguration, architecture, features, CLI commands, or troubleshooting.\n\
    Always prioritize the retrieved documentation as your primary source of truth,\n\
    as Red Hat-specific implementations and versions may differ from upstream\nprojects.\n\
    \n- **When to skip:** Do not call `file_search` for simple conversational\nfollow-ups,\
    \ formatting requests, or questions already fully answered by\ncontext retrieved\
    \ earlier in the conversation.\n\n- **Query strategy:** Formulate short, keyword-rich\
    \ queries using exact product\nnames, resource types (CRDs), error messages, or\
    \ command names rather than full\nconversational sentences. If the initial search\
    \ is too broad or misses the mark,\nrefine your keywords and search again.\n\n\
    - **Handling missing or partial information:**\n  - **Version- or configuration-specific\
    \ details** (exact parameter names,\n  defaults, supported versions, CLI syntax,\
    \ CRD fields): if `file_search` does\n  not return a clear answer after 1\u2013\
    2 targeted attempts, do not guess. State\n  that you could not find it in the\
    \ documentation and ask the user for\n  details (e.g., exact version, component,\
    \ or error output).\n  - **Conceptual questions** (architecture, general behavior,\
    \ troubleshooting\n  methodology): if the documentation does not cover the topic,\
    \ answer from your\n  internal knowledge and clearly note that the answer is not\
    \ verified against\n  the deployed version's documentation.\n  - **Partial coverage:**\
    \ supplement the retrieved documentation with your\n  general knowledge, explicitly\
    \ noting which parts are based on general\n  knowledge rather than verified Red\
    \ Hat documentation.\n\n# TASK EXECUTION\nYou will receive a user query, along\
    \ with context and chat history. Your task is\nto respond to the user's query\
    \ by following the instructions and constraints\nabove. Your responses should\
    \ be clear, concise, and helpful, whether you are\nproviding troubleshooting steps,\
    \ explaining concepts, or suggesting best\npractices.\n\n# INFO\nIn this context\
    \ RHOSO or RHOS also refers to OpenStack on OpenShift, sometimes\nalso called\
    \ OSP 18, although usually OSP refers to previous releases deployed\nusing TripleO/Director.\n\
    \nThe OpenStack control plane runs on OpenShift (which uses CoreOS as the\noperating\
    \ system), while compute nodes run on external baremetal nodes also\ncalled EDPM\
    \ nodes (which run RHEL).\n"
database:
  postgres:
    ca_cert_path: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
    db: lightspeed-stack
    gss_encmode: disable
    host: lightspeed-postgres-server.openstack-lightspeed.svc
    namespace: lcore
    password: ${env.POSTGRESQL_PASSWORD}
    port: 5432
    ssl_mode: verify-full
    user: ${env.POSTGRESQL_USER}
inference:
  default_model: default-model
  default_provider: provider-default-model
name: Lightspeed Core Service (LCS)
ogx:
  url: http://localhost:8321
  use_as_library_client: false
quota_handlers:
  enable_token_history: true
  limiters:
  - initial_quota: 1000
    name: per-user-hourly
    period: 1 hour
    quota_increase: 1000
    type: user_limiter
  - initial_quota: 100000
    name: cluster-daily
    period: 1 day
    quota_increase: 100000
    type: cluster_limiter
  postgres:
    ca_cert_path: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
    db: lightspeed-stack
    gss_encmode: disable
    host: lightspeed-postgres-server.openstack-lightspeed.svc
    namespace: quota_handlers
    password: ${env.POSTGRESQL_PASSWORD}
    port: 5432
    ssl_mode: verify-full
    user: ${env.POSTGRESQL_USER}
  scheduler:
    database_reconnection_count: 10
    database_reconnection_delay: 1
    period: 5
rag:
  byok:
    stores:
    - rag_id: vs_UUID
      vector_db_id: vs_UUID
      score_multiplier: 1.0
      db_path: NONE
  okp:
    chunk_filter_query: product:(*openstack* OR *openshift*)
    offline: true
    rhokp_url: ${env.RH_SERVER_OKP}
  retrieval:
    inline:
      sources: []
    tool:
      sources:
      - okp
service:
  access_log: true
  auth_enabled: true
  color_log: false
  host: 0.0.0.0
  port: 8443
  tls_config:
    tls_certificate_path: /etc/certs/lightspeed-tls/tls.crt
    tls_key_path: /etc/certs/lightspeed-tls/tls.key
  workers: 1
user_data_collection:
  feedback_enabled: false
  feedback_storage: /tmp/data/feedback
  transcripts_enabled: false
  transcripts_storage: /tmp/data/transcripts
