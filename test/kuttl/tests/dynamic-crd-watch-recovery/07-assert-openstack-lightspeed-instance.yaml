---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
collectors:
  - type: command
    command: ../../common/collectors/collect-workload-diagnostics.sh
timeout: 360
# Script: Go omitempty on bool omits false from serialization, kuttl YAML assert fails with
# "key is missing from map"; also parses MCP config string content within data fields
commands:
  - script: |
      #!/bin/bash
      set -euo pipefail
      source ../../common/shared_funcs.sh
      assert_openstack_ready false
      assert_mcp_openstack_enabled false
      assert_condition_status Ready True
