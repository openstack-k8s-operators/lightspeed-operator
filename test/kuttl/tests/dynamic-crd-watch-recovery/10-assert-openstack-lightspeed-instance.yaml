---
apiVersion: lightspeed.openstack.org/v1beta1
kind: OpenStackLightspeed
metadata:
  name: openstack-lightspeed
  namespace: openstack-lightspeed
status:
  openStackReady: true
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
collectors:
  - type: command
    command: ../../common/collectors/collect-workload-diagnostics.sh
timeout: 360
# Script: kuttl YAML asserts match resource structure, not string content within data fields
commands:
  - script: |
      #!/bin/bash
      set -euo pipefail
      source ../../common/shared_funcs.sh
      assert_mcp_openstack_enabled true
