---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      #!/bin/bash
      set -euo pipefail

      if OUTPUT=$(oc create -f - 2>&1 <<'EOF'
      apiVersion: lightspeed.openstack.org/v1beta1
      kind: OpenStackLightspeed
      metadata:
        name: openstack-lightspeed-duplicate
        namespace: openstack-lightspeed
      spec:
        llmEndpoint: http://mock-llm-api-server-pod:8000/v1
        llmEndpointType: openai
        llmCredentials: openstack-lightspeed-apitoken
        modelName: ibm-granite/granite-3.1-8b-instruct
      EOF
      ); then
        echo "ERROR: duplicate instance was accepted"
        exit 1
      fi

      echo "$OUTPUT"
      [[ "$OUTPUT" == *"is invalid: metadata.namespace: Forbidden: only one OpenStackLightspeed instance per namespace is allowed"* ]]
