##############################################################################
#   Assert that rhosMCPConfig is deep-merged with operator defaults          #
##############################################################################
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
collectors:
  - type: command
    command: ../../common/collectors/collect-workload-diagnostics.sh
commands:
  - script: |
      #!/bin/bash
      set -euo pipefail
      source ../../common/shared_funcs.sh

      mcp_data=$(oc get configmap mcp-config -n "$NAMESPACE" \
        -o jsonpath='{.data.config\.yaml}')

      assert_yaml_field() {
        local field="$1" expected="$2"
        local actual
        actual=$(echo "$mcp_data" | python3 -c "
      import sys, yaml
      data = yaml.safe_load(sys.stdin)
      keys = '$field'.split('.')
      val = data
      for k in keys:
          val = val[k]
      print(val)
      ")
        if [ "$actual" != "$expected" ]; then
          echo "ERROR: Expected $field=$expected, got $actual"
          echo "$mcp_data"
          exit 1
        fi
      }

      # User values should be merged
      assert_yaml_field "debug" "True"
      assert_yaml_field "workers" "4"

      # Template defaults should be preserved
      assert_yaml_field "port" "8080"
      assert_yaml_field "ip" "0.0.0.0"
      assert_yaml_field "openstack.ca_cert" "./tls-ca-bundle.pem"
      assert_yaml_field "openstack.insecure" "False"
      assert_yaml_field "openshift.insecure" "False"

      # User value in nested section should be merged
      assert_yaml_field "openstack.allow_write" "True"

      # Operator must override enabled fields
      assert_yaml_field "openstack.enabled" "False"
      assert_yaml_field "openshift.enabled" "True"
    timeout: 180
