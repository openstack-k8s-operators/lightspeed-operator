##############################################################################
#   Assert intermediate state: OSCP exists but AC not yet ready.             #
#   The operator must NOT create OpenStack resources prematurely.            #
##############################################################################
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
collectors:
  - type: command
    command: ../../common/collectors/collect-workload-diagnostics.sh
timeout: 30
commands:
  - script: |
      #!/bin/bash
      set -euo pipefail
      source ../../common/shared_funcs.sh
      assert_openstack_ready false
      assert_mcp_openstack_enabled false
