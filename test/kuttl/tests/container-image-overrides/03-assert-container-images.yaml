# Assert deployments use containerImage values from the OpenStackLightspeed spec.
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
collectors:
  - type: command
    command: ../../common/collectors/collect-workload-diagnostics.sh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightspeed-postgres-server
  namespace: openstack-lightspeed
spec:
  template:
    spec:
      containers:
        - name: lightspeed-postgres-server
          image: quay.io/sclorg/postgresql-16-c10s:latest
status:
  replicas: 1
  readyReplicas: 1
  availableReplicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightspeed-okp-server
  namespace: openstack-lightspeed
spec:
  template:
    spec:
      containers:
        - name: okp
          image: registry.redhat.io/offline-knowledge-portal/rhokp-rhel9:latest
status:
  replicas: 1
  readyReplicas: 1
  availableReplicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightspeed-stack-deployment
  namespace: openstack-lightspeed
spec:
  template:
    spec:
      initContainers:
        - name: vector-database-collect
          image: quay.io/openstack-lightspeed/rag-content:os-docs-2026.1-ogx
        - name: vector-database-config-build
          image: quay.io/lightspeed-core/lightspeed-stack:0.7.2
      containers:
        - name: ogx
          image: quay.io/lightspeed-core/lightspeed-stack:0.7.2
        - name: lightspeed-service-api
          image: quay.io/lightspeed-core/lightspeed-stack:0.7.2
        - name: lightspeed-to-dataverse-exporter
          image: quay.io/lightspeed-core/lightspeed-to-dataverse-exporter:latest
status:
  replicas: 1
  readyReplicas: 1
  availableReplicas: 1
---
apiVersion: lightspeed.openstack.org/v1beta1
kind: OpenStackLightspeed
metadata:
  name: openstack-lightspeed
  namespace: openstack-lightspeed
spec:
  database:
    containerImage: quay.io/sclorg/postgresql-16-c10s:latest
    resources:
      limits:
        cpu: 500m
        memory: 2Gi
      requests:
        cpu: 30m
        memory: 300Mi
  dataverseExporter:
    containerImage: quay.io/lightspeed-core/lightspeed-to-dataverse-exporter:latest
  lcore:
    containerImage: quay.io/lightspeed-core/lightspeed-stack:0.7.2
    resources:
      limits:
        cpu: "1"
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
  ogx:
    containerImage: quay.io/lightspeed-core/lightspeed-stack:0.7.2
    resources:
      limits:
        cpu: "2"
        memory: 8Gi
      requests:
        cpu: 500m
        memory: 2Gi
  okp:
    containerImage: registry.redhat.io/offline-knowledge-portal/rhokp-rhel9:latest
    offline: true
    resources:
      limits:
        cpu: "2"
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 2Gi
  rag:
    containerImage: quay.io/openstack-lightspeed/rag-content:os-docs-2026.1-ogx
status:
  conditions:
    - type: Ready
      status: "True"
      reason: Ready
      message: Setup complete
    - type: OpenStackLightspeedReady
      status: "True"
      reason: Ready
      message: OpenStack Lightspeed created
