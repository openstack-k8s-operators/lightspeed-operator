version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - errorlint
    - revive
    - ginkgolinter
    - govet
    - gosec
  settings:
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      - linters:
          - gosec
        path: _test\.go
      - linters:
          - gosec
        path: ^test/
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
