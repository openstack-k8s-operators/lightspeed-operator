---
- project:
    name: openstack-k8s-operators/lightspeed-operator
    default-branch: main
    github-check:
      jobs:
        - openstack-k8s-operators-content-provider
        - lightspeed-operator-kuttl
        - lightspeed-operator-must-gather

- job:
    name: lightspeed-operator-kuttl
    parent: cifmw-base-multinode-kuttl
    dependencies:
      - openstack-k8s-operators-content-provider
    attempts: 1
    irrelevant-files: &irrelevant-files
      - ^.*/*\.md$
      - ^\..*$
      - ^docs/.*$
      - ^LICENSE$
      - ^OWNERS$
      - ^OWNERS_ALIASES$
      - ^PROJECT$
      - ^README.md$
      - tests?\/functional
      - roles/.*/molecule/.*
    vars:
      cifmw_kuttl_tests_operator_list:
        - openstack_lightspeed

# Dummy job to exercise openstack-must-gather with the openstack-lightspeed
# namespace enabled. It reuses the kuttl deployment (which installs the
# operator into the openstack-lightspeed namespace) and only adds the
# lightspeed namespace to the must-gather collection list. must-gather runs
# automatically during the base job's log-collection (post) phase.
- job:
    name: lightspeed-operator-must-gather
    parent: lightspeed-operator-kuttl
    attempts: 1
    irrelevant-files: *irrelevant-files
    vars:
      cifmw_os_must_gather_additional_namespaces: "kuttl,openshift-storage,openshift-marketplace,openshift-operators,sushy-emulator,tobiko,openstack-lightspeed"
      cifmw_os_must_gather_omc: false
