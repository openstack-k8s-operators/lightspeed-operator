---
# Pre-run: create the LLM API-token Secret the OpenStack Lightspeed operator
# expects, directly from the encrypted Zuul secret.
#
# Zuul secrets are only in scope inside the job's own playbooks; they are never
# written into the inventory/hostvars that ci-framework re-serializes (that is
# why "{{ openai_credentials.api_token }}" was "undefined" during cifmw_setup).
#
# By creating the k8s Secret here -- where `openai_credentials` IS defined -- and
# leaving cifmw_openstack_lightspeed_api_token UNSET, the ci-framework hook
# (install-openstack-lightspeed.yml) skips its own secret creation and instead
# just verifies this Secret exists. The token therefore never flows through the
# cifmw parameter serialization or into any artifact.
#
# Namespace / Secret name / data key mirror the hook's defaults so the operator
# CR (llmCredentials) finds them.
- name: Create the OpenStack Lightspeed LLM API-token secret
  hosts: crc,controller
  connection: local
  gather_facts: true
  vars:
    openstack_lightspeed_namespace: "{{ cifmw_openstack_lightspeed_namespace | default('openstack-lightspeed') }}"
    openstack_lightspeed_llm_credentials: "{{ cifmw_openstack_lightspeed_llm_credentials | default('openstack-lightspeed-apitoken') }}"
    # Mirror the hook's kubeconfig resolution.
    kubeconfig_path: "{{ cifmw_openshift_kubeconfig | default(ansible_env.HOME ~ '/.crc/machines/crc/kubeconfig') }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  tasks:
    - name: Create namespace for OpenStack Lightspeed
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ openstack_lightspeed_namespace }}"
      register: _ns_result
      retries: 5
      delay: 10
      until: _ns_result is not failed

    - name: Create LLM API token secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ openstack_lightspeed_llm_credentials }}"
            namespace: "{{ openstack_lightspeed_namespace }}"
          stringData:
            apitoken: "{{ openai_credentials.api_token }}"
      register: _secret_result
      retries: 5
      delay: 10
      until: _secret_result is not failed
      no_log: true
