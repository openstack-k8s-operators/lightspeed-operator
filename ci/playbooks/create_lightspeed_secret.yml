---
# Pre-run: create the OpenStack Lightspeed LLM API token Secret in-cluster from
# the encrypted Zuul secret, so the install hook can consume it during `run`.
#
# Why create the Secret here (and not pass a var / file to the hook)?
#   * Job var  "{{ openai_credentials.api_token }}" -> fails when cifmw_setup
#     serializes ci_framework_params with to_nice_yaml ("openai_credentials is
#     undefined"): Zuul secrets are not in the inventory/hostvars scope.
#   * set_fact cacheable -> does not survive the Zuul pre-run -> run boundary.
#   * A parameters file under artifacts/ -> that tree is swept up by the
#     log-collection playbooks, so a plaintext token could get published.
#
# The Secret lands in the cluster's etcd via the API server, which the nested
# ansible-playbook call in `run` reads from. With
# cifmw_openstack_lightspeed_api_token left undefined on the job, the hook
# (hooks/playbooks/install-openstack-lightspeed.yml) takes its "verify secret
# exists" branch instead of creating its own.
#
# Runs on `crc`: the ci-framework `kubernetes` Python lib is not installed
# there, so we use `oc` (already authenticated by the earlier "Wait for CRC to
# be ready" login task). The token is passed via stdin -- never in argv (so it
# is not visible in /proc/<pid>/cmdline) -- and the task is marked no_log.
- name: Pre-create the OpenStack Lightspeed API token Secret
  hosts: crc
  gather_facts: false
  vars:
    _lightspeed_namespace: "{{ cifmw_openstack_lightspeed_namespace | default('openstack-lightspeed') }}"
    _lightspeed_secret_name: "{{ cifmw_openstack_lightspeed_llm_credentials | default('openstack-lightspeed-apitoken') }}"
  tasks:
    - name: Ensure the OpenStack Lightspeed namespace exists
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          oc create namespace {{ _lightspeed_namespace }}
          --dry-run=client -o yaml | oc apply -f -
      no_log: true

    - name: Create/refresh the LLM API token Secret
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          oc create secret generic {{ _lightspeed_secret_name }}
          --from-file=apitoken=/dev/stdin
          -n {{ _lightspeed_namespace }}
          --dry-run=client -o yaml | oc apply -f -
        stdin: "{{ openai_credentials.api_token }}"
      no_log: true
