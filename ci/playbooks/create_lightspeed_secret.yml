---
# Keep the keys used by the executor and ci-framework before creating the API
# token Secret. Read their public keys explicitly; authorized_keys order does
# not identify the build key. This replaces all other keys for the login user.
- name: Restrict SSH access to the job's automation keys
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  vars:
    _lightspeed_build_key_path: >-
      {{ zuul_temp_ssh_key | default(
           zuul.executor.work_root ~ '/' ~ zuul.build ~ '_id_' ~
           (zuul_ssh_key_algorithm | default('rsa'))) }}
    _lightspeed_build_public_key: "{{ lookup('ansible.builtin.file', _lightspeed_build_key_path ~ '.pub') }}"
  tasks:
    - name: Read the ci-framework controller public key
      ansible.builtin.slurp:
        src: ~/.ssh/id_cifw.pub
      delegate_to: controller
      run_once: true
      register: _lightspeed_controller_public_key

    - name: Require both automation public keys before replacing authorized_keys
      ansible.builtin.assert:
        that:
          - _lightspeed_build_public_key | trim | length > 0
          - _lightspeed_controller_public_key.content | b64decode | trim | length > 0
      run_once: true

    - name: Replace authorized_keys with the automation keys
      ansible.builtin.copy:
        dest: ~/.ssh/authorized_keys
        mode: "0600"
        content: |
          {{ _lightspeed_build_public_key | trim }}
          {{ _lightspeed_controller_public_key.content | b64decode | trim }}

    - name: Close the existing Ansible SSH connection
      ansible.builtin.meta: reset_connection

    - name: Verify Zuul can establish a new connection
      ansible.builtin.wait_for_connection:
        timeout: 60

# Create the token Secret in-cluster so the install hook consumes it during
# `run`. An in-cluster Secret is the only hand-off that survives: a job var is
# out of scope at serialization, set_fact doesn't cross the pre-run boundary,
# and a params file gets published by log collection. Uses `oc` because
# the Python `kubernetes` library required by Ansible's `kubernetes.core.k8s`
# module (used by CI-Framework) is absent on the CRC node.
- name: Pre-create the OpenStack Lightspeed API token Secret
  hosts: crc
  gather_facts: false
  vars:
    _lightspeed_namespace: "{{ cifmw_openstack_lightspeed_namespace | default('openstack-lightspeed') }}"
    _lightspeed_secret_name: "{{ cifmw_openstack_lightspeed_llm_credentials | default('openstack-lightspeed-apitoken') }}"
  tasks:
    - name: Ensure the OpenStack Lightspeed namespace exists
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          oc create namespace {{ _lightspeed_namespace }}
          --dry-run=client -o yaml | oc apply -f -
      no_log: true

    - name: Create/refresh the LLM API token Secret
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          oc create secret generic {{ _lightspeed_secret_name }}
          --from-file=apitoken=/dev/stdin
          -n {{ _lightspeed_namespace }}
          --dry-run=client -o yaml | oc apply -f -
        stdin: "{{ openai_credentials.api_token }}"
      no_log: true
