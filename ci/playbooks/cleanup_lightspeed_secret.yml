---
# Post-run: remove the LLM API token Secret created by
# create_lightspeed_secret.yml. The cluster is normally torn down with the rest
# of the job's nodeset, so this is mainly defense-in-depth for a surviving node
# (e.g. autohold).
#
# Referenced from the job's post-run with `cleanup: true` so Zuul makes an
# effort to run it even when the job is canceled (job.post-run.cleanup). Runs on
# `crc` where `oc` is already authenticated.
- name: Remove the OpenStack Lightspeed API token Secret
  hosts: crc
  gather_facts: false
  vars:
    _lightspeed_namespace: "{{ cifmw_openstack_lightspeed_namespace | default('openstack-lightspeed') }}"
    _lightspeed_secret_name: "{{ cifmw_openstack_lightspeed_llm_credentials | default('openstack-lightspeed-apitoken') }}"
  tasks:
    - name: Delete the LLM API token Secret if present
      ansible.builtin.command:
        cmd: >-
          oc delete secret {{ _lightspeed_secret_name }}
          -n {{ _lightspeed_namespace }}
          --ignore-not-found=true
      ignore_errors: true
      no_log: true
