---
# Post-run cleanup: remove the LLM API-token Secret created in pre-run.
#
# Referenced from the job's post-run with `cleanup: true` so Zuul makes an
# effort to run it even when the job is canceled (job.post-run.cleanup).
# Defense-in-depth only -- the nodes are ephemeral and torn down at job end.
- name: Delete the OpenStack Lightspeed LLM API-token secret
  hosts: crc,controller
  connection: local
  gather_facts: true
  vars:
    openstack_lightspeed_namespace: "{{ cifmw_openstack_lightspeed_namespace | default('openstack-lightspeed') }}"
    openstack_lightspeed_llm_credentials: "{{ cifmw_openstack_lightspeed_llm_credentials | default('openstack-lightspeed-apitoken') }}"
    kubeconfig_path: "{{ cifmw_openshift_kubeconfig | default(ansible_env.HOME ~ '/.crc/machines/crc/kubeconfig') }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  tasks:
    - name: Delete LLM API token secret
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "{{ openstack_lightspeed_llm_credentials }}"
        namespace: "{{ openstack_lightspeed_namespace }}"
      # Best-effort: never fail cleanup (e.g. cluster already gone on cancel).
      failed_when: false
      no_log: true
