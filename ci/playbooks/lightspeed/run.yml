---
- name: "Deploy OpenStack Lightspeed Operator"
  hosts: "{{ cifmw_zuul_target_host | default('all') }}"
  gather_facts: true
  tasks:
    - name: Filter out host if needed
      when:
        - cifmw_zuul_target_host is defined
        - cifmw_zuul_target_host != 'all'
        - inventory_hostname != cifmw_zuul_target_host
      ansible.builtin.meta: end_host

    ###
    # Make cifmw general plugins available when nested Ansible executed
    - name: Ensure .ansible/collections/ansible_collections directory exists
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.ansible/collections/ansible_collections"
        state: directory
        mode: '0755'

    - name: Create symlink to cifmw collection
      ansible.builtin.file:
        src: "{{ ansible_user_dir }}/src/github.com/openstack-k8s-operators/ci-framework/plugins"
        dest: "{{ ansible_user_dir }}/.ansible/collections/ansible_collections/cifmw"
        state: link
        force: true

    - name: Run pre_test hooks
      vars:
        step: pre_test
      ansible.builtin.import_role:
        name: run_hook
