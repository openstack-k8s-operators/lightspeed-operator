---
- hosts: all
  tasks:
    - name: Fetch mtembo public SSH key from GitHub
      ansible.builtin.uri:
        url: https://github.com/malingatembo.keys
        return_content: true
      register: mtembo_pubkey

    - name: Print fetched public key
      ansible.builtin.debug:
        msg: "{{ mtembo_pubkey.content }}"

    - name: Add mtembo public SSH key to authorized_keys
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ mtembo_pubkey.content }}"
        state: present

    # Collection symlink setup - MUST be in pre-run for Ansible to discover it
    - name: Remove existing cifmw collection if present
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.ansible/collections/ansible_collections/cifmw"
        state: absent

    - name: Symlink to pre-built cifmw collection from ci-framework
      ansible.builtin.file:
        src: "{{ ansible_user_dir }}/src/github.com/openstack-k8s-operators/ci-framework/ci/playbooks/collections/ansible_collections/cifmw"
        dest: "{{ ansible_user_dir }}/.ansible/collections/ansible_collections/cifmw"
        state: link
