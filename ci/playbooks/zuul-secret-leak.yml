---
# DNM experiment: does Zuul mask a *registered Zuul secret* in job-output.txt?
#
# Expectation (per Zuul docs): NO. Zuul does not perform console text-substitution
# on secret values -- it relies on Ansible's no_log to suppress task output, and
# on refusing speculative execution (post-review) to keep unreviewed changes from
# decrypting secrets in the first place. So we expect:
#   * no_log: false  -> the secret value appears IN THE CLEAR in the log.
#   * no_log: true   -> Ansible censors the whole task ("the output has been
#                       hidden due to the fact that 'no_log: true'").
#
# This is why the job must run in a POST-REVIEW pipeline: check (pre-review)
# auto-refuses any job that uses a secret and is defined in an untrusted project.
#
# `zuul_leak_secret` is the var name the secret is attached under in the job
# definition (secrets: - name: zuul_leak_secret / secret: lightspeed-zuul-mask-test);
# `.token` is the data field inside the secret.
- name: Zuul secret masking experiment
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Print registered Zuul secret WITH no_log false (expect VALUE VISIBLE)
      ansible.builtin.debug:
        msg: "ZUULMASKTEST no_log_false secret={{ zuul_leak_secret.token }}"

    - name: Print registered Zuul secret WITH no_log true (expect ***CENSORED***)
      ansible.builtin.debug:
        msg: "ZUULMASKTEST no_log_true secret={{ zuul_leak_secret.token }}"

    - name: Control - print a plain non-secret string with no_log false
      ansible.builtin.debug:
        msg: "ZUULMASKTEST control plaintext=ZUULMASKTEST-plain-not-a-secret"

    - name: Echo secret via shell with no_log false (stdout path, expect VISIBLE)
      ansible.builtin.command:
        cmd: "echo ZUULMASKTEST shell secret={{ zuul_leak_secret.token }}"
      register: _leak_echo
      changed_when: false

    - name: Show captured shell stdout (expect VALUE VISIBLE)
      ansible.builtin.debug:
        var: _leak_echo.stdout
