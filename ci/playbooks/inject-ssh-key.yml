# Add lpiwowar's public SSH keys (fetched from GitHub) to every node of the
# job so that a Zuul autohold request can keep a failed node alive and it can
# be debugged over SSH, as demonstrated in [1].
#
# NOTE: this playbook must remain LAST in the job's pre-run list.
# create_lightspeed_secret.yml replaces authorized_keys with the job's
# automation keys only and would drop any key added before it.
#
# [1] https://github.com/openstack-k8s-operators/lightspeed-operator/pull/69
- name: Inject lpiwowar public SSH keys for autohold debugging
  hosts: all
  gather_facts: false
  tasks:
    - name: Fetch lpiwowar public SSH keys from GitHub
      ansible.builtin.uri:
        url: https://github.com/lpiwowar.keys
        return_content: true
      register: lpiwowar_pubkeys

    - name: Add lpiwowar public SSH keys to authorized_keys
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ lpiwowar_pubkeys.content }}"
        state: present
