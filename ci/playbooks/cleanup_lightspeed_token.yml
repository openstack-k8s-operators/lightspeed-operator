---
# Post-run: remove the parameters file that carried the Lightspeed API token, so
# the token is not left on disk to be collected into build logs/artifacts.
#
# Referenced from the job's post-run with `cleanup: true` so Zuul makes an effort
# to run it even when the job is canceled (job.post-run.cleanup). Deleting a file
# needs no cluster/kube-config, so this is reliable at any point after pre-run.
- name: Remove the staged Lightspeed API token parameters file
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    cifmw_basedir: "{{ cifmw_basedir | default(ansible_user_dir ~ '/ci-framework-data') }}"
  tasks:
    - name: Delete the Lightspeed API token parameters file
      ansible.builtin.file:
        path: "{{ cifmw_basedir }}/artifacts/parameters/lightspeed-token.yml"
        state: absent
