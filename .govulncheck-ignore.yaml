---
# govulncheck_ignore_list_expiry_date enforces periodic review of this ignore list.
# Once the expiry date passes, it must be manually extended.
#
# IMPORTANT: Before updating this date (allowed maximum 3 months from today), do
# the following:
#   1. Remove any entry whose vulnerability is no longer detected in the code.
#   2. For remaining entries, re-confirm the risk acceptance is still valid.
#      New call paths to the vulnerable function may have been introduced since
#      the entry was last reviewed.
govulncheck_ignore_list_expiry_date: "2027-02-13"

ignored_vulnerabilities:
  - id: GO-2026-6859
    module: stdlib
    reason: |
      The current HTTP handlers do not use MaxBytesReader or MaxBytesHandler, which
      are required to trigger this race. The admission webhook limits request-body
      size with io.LimitedReader instead of http.MaxBytesReader.
      Reassess if body handling changes. Fixed in Go 1.26.11.
    traces:
      - >-
        cmd/main.go: manager.Start reaches webhook.DefaultServer.Start and
        net/http.Server.Serve. These server symbols are included in the advisory,
        but the installed admission handler uses io.LimitedReader.
      - >-
        cmd/main.go:299:21: main also starts metrics and health servers through
        metricsserver.defaultServer.Start and manager.Server.Start, respectively.
        Both call http.Server.Serve; their handlers do not use MaxBytesReader or
        MaxBytesHandler.
