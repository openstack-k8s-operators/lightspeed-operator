# These resources constitute the fully configured set of manifests
# used to generate the 'manifests/' directory in a bundle.
resources:
- bases/openstack-lightspeed-operator.clusterserviceversion.yaml
- ../default
- ../samples
- ../scorecard

# OLM supplies and mounts its own webhook certificate at the same path.
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: controller-manager
      namespace: system
    spec:
      template:
        spec:
          containers:
          - name: manager
            volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              $patch: delete
          volumes:
          - name: webhook-certs
            $patch: delete
