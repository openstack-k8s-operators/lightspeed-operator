  #   logLevel: "INFO"
  #   feedback:
  #     enabled: true
  #   transcripts:
  #     enabled: false
  #   containerImage: quay.io/lightspeed-core/lightspeed-to-dataverse-exporter:latest
  # Uncomment to enable RHOSO MCPs (MCP server sidecar with OpenStack/OpenShift tools)
  # dev:
  #   featureFlags:
  #     - rhoso_mcps
  #   okpChunkFilterQuery: "product:(*openstack* OR *openshift*)"
  #   okpRagOnly: true
