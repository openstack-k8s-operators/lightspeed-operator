  # database:
  #   size: "5Gi"
  #   class: "my-storage-class"
  #   resources:
  #     requests:
  #       cpu: "30m"
  #       memory: "300Mi"
  #     limits:
  #       cpu: "500m"
  #       memory: "2Gi"
  #   logLevel: "INFO"
  #   containerImage: quay.io/sclorg/postgresql-16-c10s:latest
  # Uncomment to customize OGX container resources and log level:
  # ogx:
