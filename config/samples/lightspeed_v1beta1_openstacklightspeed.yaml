apiVersion: lightspeed.openstack.org/v1beta1
kind: OpenStackLightspeed
metadata:
  labels:
    app.kubernetes.io/name: openstack-lightspeed-operator
    app.kubernetes.io/managed-by: kustomize
  name: openstacklightspeed-sample
spec:
  llmEndpoint: http://llm_provider:11434/v1
  llmEndpointType: openai
  llmCredentials: openstack-lightspeed-apitoken
  modelName: llama3.1:8b
  tlsCACertBundle: openstack-lightspeed-certs
  # Uncomment to override container images (falls back to operator defaults when unset):
  # rag:
  #   containerImage: quay.io/openstack-lightspeed/rag-content:os-docs-2026.1-ogx
  # Uncomment to customize persistent PostgreSQL storage:
  # database:
  #   size: "5Gi"
  #   class: "my-storage-class"
  #   resources:
  #     requests:
  #       cpu: "30m"
  #       memory: "300Mi"
  #     limits:
  #       cpu: "500m"
  #       memory: "2Gi"
  #   logLevel: "INFO"
  #   containerImage: quay.io/sclorg/postgresql-16-c10s:latest
  # Uncomment to customize OGX container resources and log level:
  # ogx:
  #   resources:
  #     requests:
  #       cpu: "500m"
  #       memory: "2Gi"
  #     limits:
  #       cpu: "2"
  #       memory: "8Gi"
  #   logLevel: "all=info"
  #   containerImage: quay.io/lightspeed-core/lightspeed-stack:dev-latest
  # Uncomment to customize lightspeed-service-api container resources and log level:
  # lcore:
  #   resources:
  #     requests:
  #       cpu: "250m"
  #       memory: "512Mi"
  #     limits:
  #       cpu: "1"
  #       memory: "2Gi"
  #   logLevel: "INFO"
  #   containerImage: quay.io/lightspeed-core/lightspeed-stack:dev-latest
