apiVersion: lightspeed.openstack.org/v1beta1
kind: OpenStackLightspeed
metadata:
  labels:
    app.kubernetes.io/name: openstack-lightspeed-operator
    app.kubernetes.io/managed-by: kustomize
  name: openstacklightspeed-sample
spec:
  llmEndpoint: http://llm_provider:11434/v1
  llmEndpointType: openai
  llmCredentials: openstack-lightspeed-apitoken
  modelName: llama3.1:8b
  tlsCACertBundle: openstack-lightspeed-certs
  # Uncomment to customize persistent PostgreSQL storage:
  # database:
  #   size: "5Gi"
  #   class: "my-storage-class"
  # Uncomment to customize container resource requests/limits:
  # resources:
  #   llamaStack:
  #     requests:
  #       cpu: "500m"
  #       memory: "2Gi"
  #     limits:
  #       cpu: "2"
  #       memory: "8Gi"
  #   lightspeedService:
  #     requests:
  #       cpu: "250m"
  #       memory: "512Mi"
  #     limits:
  #       cpu: "1"
  #       memory: "2Gi"
  #   postgres:
  #     requests:
  #       cpu: "30m"
  #       memory: "300Mi"
  #     limits:
  #       cpu: "500m"
  #       memory: "2Gi"
  # Uncomment to customize log levels (DEBUG, INFO, WARNING, ERROR, CRITICAL):
  # logging:
  #   ogxLogLevel: "all=info"
  #   lightspeedStackLogLevel: "INFO"
  #   dataverseExporterLogLevel: "INFO"
  # Uncomment to enable RHOSO MCPs (MCP server sidecar with OpenStack/OpenShift tools)
  # dev:
  #   featureFlags:
  #     - rhoso_mcps
  #   okpChunkFilterQuery: "product:(*openstack* OR *openshift*)"
  #   okpRagOnly: true
  #   # Custom MCP server config (deep-merged with operator defaults;
  #   # openstack.enabled and openshift.enabled are always overridden):
  #   rhosMCPConfig: |
  #     debug: true
  #     workers: 4
  # okp:
  #   accessKey: okp-access-key-secret
  # Uncomment to enable quota enforcement (opt-in; omit or leave limiters empty to disable):
  # quotas:
  #   limiters:
  #     - name: per-user-hourly
  #       type: userLimiter
  #       initialQuota: 1000
  #       quotaIncrease: 1000
  #       period: "1 hour"
  #     - name: cluster-daily
  #       type: clusterLimiter
  #       initialQuota: 100000
  #       quotaIncrease: 100000
  #       period: "1 day"
  #   scheduler:
  #     period: 30
  #     databaseReconnectionCount: 10
  #     databaseReconnectionDelay: 1
  #   enableTokenHistory: true
