apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: openstack-lightspeed-operator
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: openstack-lightspeed-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: openstack-lightspeed-operator
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: openstack-lightspeed-operator
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        name: manager
        ports: []
        env:
          - name: WATCH_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
            # TODO(lpiwowar): Replace this with a stable (non-alpha) image version once
            # the automated pipeline for building OGX-compatible vector database images
            # is ready.
          - name: RELATED_IMAGE_OPENSTACK_LIGHTSPEED_IMAGE_URL_DEFAULT
            value: quay.io/openstack-lightspeed/rag-content:os-docs-2026.1-ogx
          - name: RELATED_IMAGE_LCORE_IMAGE_URL_DEFAULT
            value: quay.io/lightspeed-core/lightspeed-stack:latest
          - name: RELATED_IMAGE_EXPORTER_IMAGE_URL_DEFAULT
            value: quay.io/lightspeed-core/lightspeed-to-dataverse-exporter:latest
          - name: RELATED_IMAGE_POSTGRES_IMAGE_URL_DEFAULT
            value: quay.io/sclorg/postgresql-16-c10s:latest
          - name: RELATED_IMAGE_OKP_IMAGE_URL_DEFAULT
            value: registry.redhat.io/offline-knowledge-portal/rhokp-rhel9:latest
          - name: RELATED_IMAGE_CONSOLE_IMAGE_URL_DEFAULT
            value: registry.redhat.io/openshift-lightspeed/lightspeed-console-plugin-rhel9:1.0.12
          - name: RELATED_IMAGE_CONSOLE_PF5_IMAGE_URL_DEFAULT
            value: registry.redhat.io/openshift-lightspeed/lightspeed-console-plugin-pf5-rhel9:1.0.12
          - name: RELATED_IMAGE_MCP_SERVER_IMAGE_URL_DEFAULT
            value: quay.io/openstack-lightspeed/lightspeed-mcps:latest
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 128Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
